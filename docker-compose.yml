services:
  # ── DataTagger MCP ──────────────────────────────────────────────────────────
  datatagger-proxy:
    build:
      context: .
      dockerfile: datatagger-proxy/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - FDM_BASE_URL=${FDM_BASE_URL:-https://datatagger.ub.tum.de}
      - URL_PREFIX=/dt
      - MCP_PORT=8000
      - MCP_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
    mem_limit: 256m

  # ── NOMAD MCP (read-only, registration + deployment default PAT) ─────────
  nomad-mcp:
    build:
      context: .
      dockerfile: nomad-mcp/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # The deployment's own NOMAD (the Oasis behind the internal nginx) unless
      # overridden; the register page lets a user point at any NOMAD instead.
      - NOMAD_BASE_URL=${NOMAD_MCP_BASE_URL:-http://proxy:80/nomad-oasis/api/v1}
      - NOMAD_GUI_URL=${NOMAD_MCP_GUI_URL:-}
      # Read-only access for callers that never register.
      - NOMAD_MCP_DEFAULT_PAT=${NOMAD_MCP_DEFAULT_PAT:-}
      - NOMAD_MCP_ALLOW_ANONYMOUS=${NOMAD_MCP_ALLOW_ANONYMOUS:-true}
      - NOMAD_MCP_REQUIRE_TOKEN=${NOMAD_MCP_REQUIRE_TOKEN:-false}
      - NOMAD_MCP_RATE_LIMIT=${NOMAD_MCP_RATE_LIMIT:-120}
      - NOMAD_MCP_MAX_RESPONSE_CHARS=${NOMAD_MCP_MAX_RESPONSE_CHARS:-60000}
      - NOMAD_MCP_TIMEOUT_S=${NOMAD_MCP_TIMEOUT_S:-60}
      - URL_PREFIX=/nm
      - MCP_PORT=8000
      - MCP_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    networks:
      - default
      - nomad_oasis_network
    mem_limit: 512m
    stop_grace_period: 15s

  # ── elabFTW MCP (shared R worker, one process for all users) ──
  elabmcp-proxy:
    build:
      context: .
      dockerfile: elabmcp-proxy/Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - ELABMCP_PROXY_HOST=0.0.0.0
      - ELABMCP_PROXY_PORT=8081
      - URL_PREFIX=/el
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
      - ELABMCP_RATE_LIMIT=10/minute
      - ELABMCP_R_PORT=18080
      - MCP_CONFIG_PATH=/elabmcp-proxy/config.dynamic.yml
      - ELABMCP_AUDIT_LOG=/var/log/elabmcp-proxy/audit.log
    mem_limit: 2g
    stop_grace_period: 30s

  # ── eConversion Papers MCP / Streamlit ───────────────────────────────────
  econversion:
    build:
      # The app ships its own Dockerfile (FastAPI + uvicorn, python:3.12).
      context: ./econversion
      dockerfile: Dockerfile
      args:
        # Deploy sets these: ECONVERSION_GIT_SHA=$(git -C econversion rev-parse --short HEAD)
        GIT_SHA: ${ECONVERSION_GIT_SHA:-unknown}
        BUILD_TIME: ${ECONVERSION_BUILD_TIME:-}
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - PYTHONUNBUFFERED=1
      # nginx forwards the full path, so the app mounts itself under this prefix.
      - ROOT_PATH=/nomad-oasis/api/everse
      - PORT=8501
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      # Optional test accounts: the connect dialog offers a one-click sign-in for
      # whichever of these is set. Values stay server-side (never in the browser).
      - ELABFTW_TEST_TOKEN=${ELABFTW_TEST_TOKEN:-}
      - DATATAGGER_TEST_TOKEN=${DATATAGGER_TEST_TOKEN:-}
      # Public MCP endpoints the app calls. Override when the canonical
      # hostname changes; empty = the built-in default (duckdns).
      - ELAB_MCP_URL=${ELAB_MCP_URL:-}
      - DATATAGGER_MCP_URL=${DATATAGGER_MCP_URL:-}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
      - API_KEY=${ECONVERSION_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LOG_DIR=/app/logs
      # Set to 1 to log raw tool arguments (they contain the user's queries).
      - LOG_TOOL_ARGS=${LOG_TOOL_ARGS:-0}
    volumes:
      - ./econversion/data:/app/data
      # Logs survive rebuilds (host-side, rotated; feedback goes to data/feedback)
      - ./econversion/logs:/app/logs
      # HF cache (HF_HOME=/app/.hf in the image): keeps bge-small across rebuilds.
      - econversion_hf:/app/.hf
    mem_limit: 2g
    stop_grace_period: 30s
    # Bound the docker json-file log too (the app rotates its own file)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - nomad_oasis_network

  # ── elab-app (Streamlit-Frontend fuer elabFTW) ────────────────────────────
  elab-app:
    build:
      context: ./elab-app
    restart: unless-stopped
    expose:
      - "8501"
    mem_limit: 256m
    stop_grace_period: 10s
    volumes:
      - elab_app_data:/root/.config/elab_app

  # ── proespm (wissenschaftliche Datenverarbeitung) ────────────────────────
  proespm-app:
    build:
      context: ./proespm-app
    restart: unless-stopped
    expose:
      - "8501"
    mem_limit: 512m
    stop_grace_period: 30s

  # ── eLabFTW (self-hosted ELN) ──────────────────────────────────────────
  elab-mysql:
    image: mysql:8.4
    container_name: elab-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=elabftw
      - MYSQL_USER=elabftw
      - MYSQL_PASSWORD=${ELABFTW_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${ELABFTW_MYSQL_ROOT_PASSWORD}
    volumes:
      - elab_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/bin/mysql", "--user=elabftw", "--password=${ELABFTW_DB_PASSWORD}", "--execute", "SHOW DATABASES;"]
      interval: 5s
      timeout: 5s
      retries: 42
    mem_limit: 512m

  elabftw:
    image: elabftw/elabimg:6.0.2
    container_name: elabftw
    restart: unless-stopped
    user: "999:994"
    read_only: true
    tmpfs:
      - /run:mode=755,uid=999,gid=994,exec,nosuid,nodev
      - /var/cache/elabftw:mode=755,uid=999,gid=994,exec,nosuid,nodev
    depends_on:
      elab-mysql:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      - DB_HOST=elab-mysql
      - DB_PORT=3306
      - DB_NAME=elabftw
      - DB_USER=elabftw
      - DB_PASSWORD=${ELABFTW_DB_PASSWORD}
      - SITE_URL=https://elabftw.researchmcp.duckdns.org
      - DISABLE_HTTPS=true
      - SECRET_KEY=${ELABFTW_SECRET_KEY}
      - PHP_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - elab_uploads:/var/lib/elabftw/uploads
      - elab_exports:/var/lib/elabftw/exports
      - elab_nginx_cache:/var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

  # ── Caddy reverse proxy ──────────────────────────────────────────────────
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ECONVERSION_BCRYPT_HASH=${ECONVERSION_BCRYPT_HASH}
      # e-converse demo gate (e-converse/caddy/econverse.caddy)
      - ECONVERSE_DEMO_HASH=${ECONVERSE_DEMO_HASH}
      - ECONVERSE_ADMIN_HASH=${ECONVERSE_ADMIN_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/http:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - datatagger-proxy
      - nomad-mcp
      - elabmcp-proxy
      - econversion
      - elab-app
      - proespm-app
      - elabftw
    networks:
      - default
      - nomad_oasis_network
    mem_limit: 128m

volumes:
  econversion_hf: {}
  caddy_data:
  caddy_config:
  elab_app_data: {}
  elab_mysql: {}
  elab_uploads: {}
  elab_exports: {}
  elab_nginx_cache: {}

networks:
  internal:
  nomad_oasis_network:
    external: true
