services:
  # ── DataTagger MCP ──────────────────────────────────────────────────────────
  datatagger-proxy:
    build:
      context: .
      dockerfile: datatagger-proxy/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - FDM_BASE_URL=${FDM_BASE_URL:-https://datatagger.ub.tum.de}
      - URL_PREFIX=/dt
      - MCP_PORT=8000
      - MCP_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
    mem_limit: 256m

  # ── NOMAD MCP (read-only, registration + deployment default PAT) ─────────
  nomad-mcp:
    build:
      # the server is its own repository (e-conversion/nomad-oasis-mcp); this
      # submodule is a checkout of it
      context: ./nomad-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # The deployment's own NOMAD (the Oasis behind the internal nginx) unless
      # overridden; the register page lets a user point at any NOMAD instead.
      - NOMAD_BASE_URL=${NOMAD_MCP_BASE_URL:-http://proxy:80/nomad-oasis/api/v1}
      - NOMAD_GUI_URL=${NOMAD_MCP_GUI_URL:-}
      # Read-only access for callers that never register.
      - NOMAD_MCP_DEFAULT_PAT=${NOMAD_MCP_DEFAULT_PAT:-}
      - NOMAD_MCP_ALLOW_ANONYMOUS=${NOMAD_MCP_ALLOW_ANONYMOUS:-true}
      - NOMAD_MCP_REQUIRE_TOKEN=${NOMAD_MCP_REQUIRE_TOKEN:-false}
      - NOMAD_MCP_RATE_LIMIT=${NOMAD_MCP_RATE_LIMIT:-120}
      - NOMAD_MCP_MAX_RESPONSE_CHARS=${NOMAD_MCP_MAX_RESPONSE_CHARS:-60000}
      - NOMAD_MCP_TIMEOUT_S=${NOMAD_MCP_TIMEOUT_S:-60}
      - URL_PREFIX=/nm
      - MCP_PORT=8000
      - MCP_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    networks:
      - default
      - nomad_oasis_network
    mem_limit: 512m
    stop_grace_period: 15s

  # ── elabFTW MCP, standalone Python server (tum-research-data-hub/elabmcp) ──
  # Runs beside the R-based elabmcp-proxy while /el is being moved over. Caddy
  # keeps pointing at elabmcp-proxy until the switch; the published port exists
  # for the comparison run on the host and is dropped after the switch.
  elabmcp:
    build:
      context: ./elabmcp
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8082:8081"   # temporary: verification on the host
    environment:
      - ELABFTW_MCP_URL_PREFIX=/el
      - ELABFTW_MCP_PORT=8081
      - ELABFTW_MCP_HOST=0.0.0.0
      - ELABFTW_MCP_CONFIG=/app/config.yml
      - ELABFTW_MCP_AUDIT_LOG=/app/logs/audit.jsonl
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
      - ELABFTW_MCP_RATE_LIMIT=${ELABFTW_MCP_RATE_LIMIT:-10}
      # No AI key on purpose: the deployment has none today, so the AI tools
      # answer with the placeholder wording. Set the key in .env to enable them.
      - ELABFTW_MCP_AI_API_KEY=${ELABFTW_MCP_AI_API_KEY:-}
      - ELABFTW_MCP_AI_BASE_URL=${ELABFTW_MCP_AI_BASE_URL:-}
      - ELABFTW_MCP_AI_MODEL=${ELABFTW_MCP_AI_MODEL:-gpt-4o}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/status', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    stop_grace_period: 15s

  # ── elabFTW MCP (shared R worker, one process for all users) ──
  elabmcp-proxy:
    build:
      context: .
      dockerfile: elabmcp-proxy/Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - ELABMCP_PROXY_HOST=0.0.0.0
      - ELABMCP_PROXY_PORT=8081
      - URL_PREFIX=/el
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}
      - MCP_TOKEN_EXPIRY_DAYS=${MCP_TOKEN_EXPIRY_DAYS:-30}
      - ELABMCP_RATE_LIMIT=10/minute
      - ELABMCP_R_PORT=18080
      - MCP_CONFIG_PATH=/elabmcp-proxy/config.dynamic.yml
      - ELABMCP_AUDIT_LOG=/var/log/elabmcp-proxy/audit.log
    mem_limit: 2g
    stop_grace_period: 30s

  # ── elab-app (Streamlit-Frontend fuer elabFTW) ────────────────────────────
  elab-app:
    build:
      context: ./elab-app
    restart: unless-stopped
    expose:
      - "8501"
    mem_limit: 256m
    stop_grace_period: 10s
    volumes:
      - elab_app_data:/root/.config/elab_app

  # ── proespm (wissenschaftliche Datenverarbeitung) ────────────────────────
  proespm-app:
    build:
      context: ./proespm-app
    restart: unless-stopped
    expose:
      - "8501"
    mem_limit: 512m
    stop_grace_period: 30s

  # ── eLabFTW (self-hosted ELN) ──────────────────────────────────────────
  elab-mysql:
    image: mysql:8.4
    container_name: elab-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=elabftw
      - MYSQL_USER=elabftw
      - MYSQL_PASSWORD=${ELABFTW_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${ELABFTW_MYSQL_ROOT_PASSWORD}
    volumes:
      - elab_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/bin/mysql", "--user=elabftw", "--password=${ELABFTW_DB_PASSWORD}", "--execute", "SHOW DATABASES;"]
      interval: 5s
      timeout: 5s
      retries: 42
    mem_limit: 512m

  elabftw:
    image: elabftw/elabimg:6.0.2
    container_name: elabftw
    restart: unless-stopped
    user: "999:994"
    read_only: true
    tmpfs:
      - /run:mode=755,uid=999,gid=994,exec,nosuid,nodev
      - /var/cache/elabftw:mode=755,uid=999,gid=994,exec,nosuid,nodev
    depends_on:
      elab-mysql:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      - DB_HOST=elab-mysql
      - DB_PORT=3306
      - DB_NAME=elabftw
      - DB_USER=elabftw
      - DB_PASSWORD=${ELABFTW_DB_PASSWORD}
      - SITE_URL=https://elabftw.researchmcp.duckdns.org
      - DISABLE_HTTPS=true
      - SECRET_KEY=${ELABFTW_SECRET_KEY}
      - PHP_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - elab_uploads:/var/lib/elabftw/uploads
      - elab_exports:/var/lib/elabftw/exports
      - elab_nginx_cache:/var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

  # ── Caddy reverse proxy ──────────────────────────────────────────────────
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The econverse host block is not kept here: it lives in the atlas
      # deployment (private GitLab) and is imported from this directory. One
      # copy, one place to change it.
      - ../atlas/caddy:/etc/caddy/sites:ro
      - ./web:/srv/http:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - datatagger-proxy
      - nomad-mcp
      - elabmcp-proxy
      - elab-app
      - proespm-app
      - elabftw
    networks:
      - default
      - nomad_oasis_network
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
  elab_app_data: {}
  elab_mysql: {}
  elab_uploads: {}
  elab_exports: {}
  elab_nginx_cache: {}

networks:
  internal:
  nomad_oasis_network:
    external: true
