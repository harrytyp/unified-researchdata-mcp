[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-mcp"
version = "0.1.0"
description = "Read-only Model Context Protocol server for the NOMAD API"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.28.0",
    "uvicorn>=0.31.1",
    "starlette>=0.48.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
nomad-mcp = "nomad_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nomad_mcp = ["py.typed"]
