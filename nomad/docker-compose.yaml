networks:
  default:
    name: nomad_oasis_network
    external: true
services:
  app:
    command: bash /app/plugins/startup.sh admin run app --with-gui --gunicorn --host
      0.0.0.0
    container_name: nomad_oasis_app
    depends_on:
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
      north:
        condition: service_started
      temporal:
        condition: service_healthy
    env_file:
    - ./.env
    environment:
      NOMAD_CONFIG: /app/nomad.yaml
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: $PWD
      NOMAD_LOGSTASH_HOST: logtransfer
      NOMAD_MONGO_HOST: mongo
      NOMAD_NORTH_HUB_HOST: north
      NOMAD_SERVICE: nomad_oasis_app
      NOMAD_SERVICES_API_PORT: 80
      NOMAD_TEMPORAL_HOST: temporal
      PYTHONPATH: /app/plugins
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 10s
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8000/-/health
      timeout: 10s
    image: ghcr.io/fairmat-nfdi/nomad-distro-template:main
    platform: linux/amd64
    restart: unless-stopped
    volumes:
    - ./.volumes/fs:/app/.volumes/fs
    - /home/debian/unified-researchdata-mcp/nomad/plugins:/app/plugins
    - /home/debian/unified-researchdata-mcp/nomad/.nomad_pat:/app/.nomad_pat:ro
    - /home/debian/unified-researchdata-mcp/nomad/configs/nomad.yaml:/app/nomad.yaml
  elastic:
    container_name: nomad_oasis_elastic
    environment:
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    - discovery.type=single-node
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 60s
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://elastic:9200/_cat/health
      timeout: 10s
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    restart: unless-stopped
    volumes:
    - elastic:/usr/share/elasticsearch/data
  jupyterlab_image:
    container_name: nomad_jupyter_image
    deploy:
      replicas: 0
    entrypoint:
    - 'true'
    image: ghcr.io/fairmat-nfdi/nomad-distro-template/jupyter:main
    platform: linux/amd64
    pull_policy: always
  logtransfer:
    command: python3 /app/plugins/nomad_launcher.py admin run logtransfer
    container_name: nomad_oasis_logtransfer
    depends_on:
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
    - ./.env
    environment:
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_SERVICE: nomad_oasis_logtransfer
    image: ghcr.io/fairmat-nfdi/nomad-distro-template:main
    platform: linux/amd64
    profiles:
    - with_logtransfer
    restart: unless-stopped
    volumes:
    - ./.volumes/fs:/app/.volumes/fs
    - /home/debian/unified-researchdata-mcp/nomad/plugins:/app/plugins
    - /home/debian/unified-researchdata-mcp/nomad/.nomad_pat:/app/.nomad_pat:ro
  mongo:
    command: mongod --logpath=/dev/null
    container_name: nomad_oasis_mongo
    environment:
    - MONGO_DATA_DIR=/data/db
    - MONGO_LOG_DIR=/dev/null
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 10s
      test:
      - CMD
      - mongosh
      - mongo:27017/test
      - --quiet
      - --eval
      - '''db.runCommand({ping:1}).ok'''
      timeout: 10s
    image: docker.io/mongo:8.0
    restart: unless-stopped
    volumes:
    - mongo:/data/db
    - ./.volumes/mongo:/backup
  north:
    command: python3 /app/plugins/nomad_launcher.py admin run hub
    container_name: nomad_oasis_north
    env_file:
    - ./.env
    environment:
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: $PWD
      NOMAD_MONGO_HOST: mongo
      NOMAD_NORTH_DOCKER_NETWORK: nomad_oasis_network
      NOMAD_NORTH_HUB_CONNECT_IP: north
      NOMAD_NORTH_HUB_HOST: north
      NOMAD_NORTH_HUB_IP: 0.0.0.0
      NOMAD_SERVICE: nomad_oasis_north
      NOMAD_SERVICES_API_HOST: app
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 10s
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8081/nomad-oasis/north/hub/health
      timeout: 10s
    image: ghcr.io/fairmat-nfdi/nomad-distro-template:main
    platform: linux/amd64
    restart: unless-stopped
    user: 1000:991
    volumes:
    - ./.volumes/fs:/app/.volumes/fs
    - /home/debian/unified-researchdata-mcp/nomad/plugins:/app/plugins
    - /home/debian/unified-researchdata-mcp/nomad/.nomad_pat:/app/.nomad_pat:ro
    - /var/run/docker.sock:/var/run/docker.sock
  postgresql:
    container_name: nomad_oasis_postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    healthcheck:
      interval: 5s
      retries: 60
      start_period: 30s
      test:
      - CMD-SHELL
      - pg_isready -U temporal
      timeout: 5s
    image: docker.io/postgres:16
    volumes:
    - postgresql:/var/lib/postgresql/data
  proxy:
    command: nginx -g 'daemon off;'
    container_name: nomad_oasis_proxy
    depends_on:
      app:
        condition: service_healthy
      north:
        condition: service_healthy
      worker:
        condition: service_started
    image: docker.io/nginx:1.27.4-alpine
    restart: unless-stopped
    volumes:
    - ./configs/nginx_base_conf:/etc/nginx/conf.d/nginx_base_conf:ro
    - ./configs/nginx_http.conf:/etc/nginx/conf.d/default.conf:ro
  temporal:
    container_name: nomad_oasis_temporal
    depends_on:
      postgresql:
        condition: service_healthy
      temporal-setup-db:
        condition: service_completed_successfully
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_USER=temporal
    - POSTGRES_PWD=temporal
    - POSTGRES_SEEDS=postgresql
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CLI_ADDRESS=temporal:7233
    - BIND_ON_IP=0.0.0.0
    - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    healthcheck:
      interval: 5s
      retries: 60
      start_period: 30s
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '7233'
      timeout: 3s
    image: temporalio/server:1.30
    volumes:
    - ./configs/_temporal-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
  temporal-create-namespace:
    command:
    - create_namespace
    container_name: temporal-create-namespace
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - /scripts/_setup_temporal.sh
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - DEFAULT_NAMESPACE=default
    image: temporalio/admin-tools:1.30
    restart: on-failure:5
    volumes:
    - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
  temporal-setup-db:
    command:
    - setup_db
    container_name: temporal-setup-db
    depends_on:
      postgresql:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - /scripts/_setup_temporal.sh
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_USER=temporal
    - POSTGRES_PWD=temporal
    - POSTGRES_SEEDS=postgresql
    - SQL_PASSWORD=temporal
    image: temporalio/admin-tools:1.30
    restart: on-failure:6
    volumes:
    - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
  worker:
    command: python -m nomad.cli admin run action-internal-worker
    depends_on:
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 15
        window: 1800s
    env_file:
    - ./.env
    environment:
      NOMAD_CONFIG: /app/nomad.yaml
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_LOGSTASH_HOST: logtransfer
      NOMAD_MONGO_HOST: mongo
      NOMAD_SERVICE: nomad_oasis_worker
      NOMAD_TEMPORAL_HOST: temporal
      PYTHONPATH: /app/plugins
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 15s
      test: ls /
      timeout: 5s
    image: ghcr.io/fairmat-nfdi/nomad-distro-template:main
    platform: linux/amd64
    restart: unless-stopped
    volumes:
    - ./.volumes/fs:/app/.volumes/fs
    - /home/debian/unified-researchdata-mcp/nomad/plugins:/app/plugins
    - /home/debian/unified-researchdata-mcp/nomad/.nomad_pat:/app/.nomad_pat:ro
volumes:
  elastic:
    name: nomad_oasis_elastic
  keycloak:
    name: nomad_oasis_keycloak
  mongo:
    name: nomad_oasis_mongo
  postgresql:
    name: nomad_oasis_postgresql
